<style id="v10-settings-access">
.accessSearch{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.accessInfo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.accessInfo .mini{background:#f7f9fc;border:1px solid #e3e9f0;border-radius:12px;padding:11px}
.accessInfo .mini .k{font-size:10px;color:#718096;margin-bottom:4px}
.accessInfo .mini .v{font-weight:900;color:#0b2d5b}
.permissionRows{margin-top:14px}
.permissionRow{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f5}
.permissionRow:last-child{border-bottom:0}
.permissionName{font-weight:800;color:#26384d}
.permissionHint{font-size:10px;color:#8a98a8;margin-top:3px}
.permissionSelect{width:100%;height:44px}
.accessActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.accessMsg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:12px;display:none}
.accessMsg.show{display:block}
.accessMsg.ok{background:#eaf8ef;color:#15803d}
.accessMsg.err{background:#fff0f1;color:#b42318}
@media(max-width:600px){
  .accessSearch{grid-template-columns:1fr}
  .accessInfo{grid-template-columns:1fr 1fr}
  .permissionRow{grid-template-columns:1fr}
}

<style id="V10_LOGIN_DESKTOP_STABILITY">

<style id="V10_TYPOGRAPHY_AND_LOGIN_CENTERING">
/* Persian typography: consistent Vazirmatn across internal pages */
html,body,button,input,select,textarea,table{font-family:'Vazirmatn',Tahoma,Arial,sans-serif!important}
body{font-size:14px!important;line-height:1.75!important;letter-spacing:0!important}
button,input,select,textarea{font-size:14px!important;line-height:1.6!important}
.top,.side,.main{font-family:'Vazirmatn',Tahoma,Arial,sans-serif!important}
.brand{font-size:16px!important;letter-spacing:-.2px}
.role,.sub,.lbl,.k,small,.field label{font-weight:400!important;line-height:1.8!important}
.title{font-size:21px!important;line-height:1.65!important;letter-spacing:-.25px}
.sectionHead{font-size:15px!important}
.nav{font-size:13px!important;font-weight:600!important}
.metric .lbl,.tile .k{font-size:12px!important}
.metric .num{font-size:22px!important;line-height:1.45!important;font-variant-numeric:tabular-nums}
th,td{font-size:12.5px!important;line-height:1.75!important}
.btn,.logout,.profileSettingsBtn{font-family:'Vazirmatn',Tahoma,Arial,sans-serif!important;font-weight:700!important}
.profileName{line-height:1.6!important}
/* Desktop: preserve the original 2:3 login artwork ratio and center it */
@media(min-width:601px){
 .loginInner{inset:auto!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:min(100vw,66.6667svh)!important;height:min(100svh,150vw)!important;max-width:none!important;min-height:0!important;background-size:100% 100%!important;background-position:center!important;background-repeat:no-repeat!important}
 .loginOverlay{inset:0!important;width:100%!important;height:100%!important}
}
/* Mobile keeps the existing full-screen login composition */
@media(max-width:600px){
 .loginInner{inset:0!important;left:0!important;top:0!important;transform:none!important;width:100vw!important;height:100svh!important;max-width:none!important;background-size:100% 100%!important}
}
</style>
<style id="V10_DASHBOARD_BENTO_V4">
.dash-overview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:dense;gap:12px;align-items:stretch}
.dash-overview-grid .metric{min-width:0;min-height:112px;display:flex;flex-direction:column;justify-content:center}
.dash-overview-grid .metric.wide{grid-column:span 2}
.dash-overview-grid .metric.dash-priority{min-height:148px}
.dash-overview-grid .metric.dash-priority .num{font-size:clamp(22px,2vw,30px)}
.dash-monthly-layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(210px,1fr);gap:12px;align-items:stretch}
.dash-financial-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.dash-financial-grid .metric{min-width:0;min-height:112px;display:flex;flex-direction:column;justify-content:center}
.dash-financial-grid .metric.dash-priority{min-height:148px}
.dash-member-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.dash-member-stats .metric{min-width:0;min-height:100px;display:flex;flex-direction:column;justify-content:center}
.dash-member-stats .metric:last-child:nth-child(odd){grid-column:1/-1}
.dash-unit{font-size:11px;color:#718096;margin-top:3px}
.dash-overview-grid .metric:last-child:nth-child(odd){grid-column:1/-1}
@media(max-width:950px){.dash-overview-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.dash-overview-grid .metric.wide{grid-column:span 2}.dash-overview-grid .metric:last-child:nth-child(odd){grid-column:1/-1}.dash-monthly-layout{grid-template-columns:1fr}.dash-financial-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.dash-financial-grid .metric.dash-priority{grid-column:span 1}.dash-member-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
@media(max-width:520px){.dash-overview-grid .metric,.dash-financial-grid .metric,.dash-member-stats .metric{padding:12px;min-height:92px}.dash-overview-grid .metric.dash-priority,.dash-financial-grid .metric.dash-priority{min-height:112px}.dash-overview-grid .metric .num,.dash-financial-grid .metric .num,.dash-member-stats .metric .num{font-size:19px;overflow-wrap:anywhere}.dash-member-stats .metric:last-child:nth-child(odd){grid-column:1/-1}}
</style>

<style id="V10_DASHBOARD_BENTO_LAYOUT_FINAL">
.dash-overview-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-flow:row dense}

<style id="V10_DASHBOARD_MOSAIC_AND_STABILITY">
/* Mosaic dashboard: two large anchors plus compact, color-coded indicators */
.dash-overview-grid{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-auto-flow:dense!important;gap:12px!important;align-items:stretch!important}
.dash-overview-grid .metric{min-width:0!important;min-height:112px!important;display:flex!important;flex-direction:column!important;justify-content:center!important;overflow:hidden!important;border:1px solid rgba(25,55,90,.10)!important;border-top-width:4px!important;border-radius:15px!important;padding:15px!important;box-shadow:0 3px 10px rgba(20,45,75,.045)!important}
.dash-overview-grid .metric.dash-hero{grid-column:span 3!important;grid-row:span 2!important;min-height:236px!important;padding:22px!important}
.dash-overview-grid .metric.dash-hero .lbl{font-size:14px!important;font-weight:800!important}
.dash-overview-grid .metric.dash-hero .num{font-size:clamp(22px,2.3vw,32px)!important;line-height:1.5!important;overflow-wrap:anywhere!important}
.dash-overview-grid .metric.dash-small{grid-column:span 1!important;min-height:112px!important}
.dash-overview-grid .metric .lbl{font-weight:800!important;color:#26384d!important}
.dash-overview-grid .metric .num{font-weight:900!important;font-variant-numeric:tabular-nums!important;overflow-wrap:anywhere!important}
.dash-overview-grid .metric.green{background:linear-gradient(145deg,#e6f7ee,#f5fcf8)!important;border-color:#a7dfbf!important;border-top-color:#159957!important}
.dash-overview-grid .metric.blue{background:linear-gradient(145deg,#e7f0ff,#f5f8ff)!important;border-color:#b3cdf8!important;border-top-color:#2672d8!important}
.dash-overview-grid .metric.red{background:linear-gradient(145deg,#fff0ed,#fff8f6)!important;border-color:#f2c0b7!important;border-top-color:#df684d!important}
.dash-overview-grid .metric.amber{background:linear-gradient(145deg,#fff6df,#fffbf1)!important;border-color:#ecd59a!important;border-top-color:#d39a20!important}
.dash-overview-grid .metric.violet{background:linear-gradient(145deg,#f0eaff,#faf8ff)!important;border-color:#d0c0f4!important;border-top-color:#8056c7!important}
.dash-overview-grid .metric.teal{background:linear-gradient(145deg,#e1f7f6,#f5fcfb)!important;border-color:#a5dcd7!important;border-top-color:#159b91!important}
.dash-overview-grid .metric.orange{background:linear-gradient(145deg,#fff0df,#fff9f1)!important;border-color:#f2d0a8!important;border-top-color:#e18a27!important}
.dash-overview-grid .metric.rose{background:linear-gradient(145deg,#ffeaf0,#fff7f9)!important;border-color:#f1bfd0!important;border-top-color:#c94d79!important}
@media(max-width:950px){.dash-overview-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:9px!important}.dash-overview-grid .metric.dash-hero{grid-column:span 2!important;grid-row:span 2!important;min-height:210px!important}.dash-overview-grid .metric.dash-small{grid-column:span 1!important}}
@media(max-width:600px){.dash-overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.dash-overview-grid .metric{min-height:100px!important;padding:11px!important;border-radius:12px!important}.dash-overview-grid .metric.dash-hero{grid-column:span 2!important;grid-row:auto!important;min-height:128px!important;padding:15px!important}.dash-overview-grid .metric.dash-small{grid-column:span 1!important;min-height:104px!important}.dash-overview-grid .metric .lbl{font-size:11px!important}.dash-overview-grid .metric .num{font-size:19px!important;line-height:1.4!important}.dash-overview-grid .metric.dash-hero .num{font-size:22px!important}}
</style>

    statTile('تعداد وام پرداختی',selected.loanCount??(r.monthly||{}).loanCount??0,'blue','🧾')

  const monthlyHtml=`<div class="pj-bento-two pj-monthly-bento">${[monthlyLeft,monthlyRight].map(group=>`<div class="pj-bento-column">${group[0]}<div class="pj-bento-four">${group.slice(1).join('')}</div></div>`).join('')}</div>`;
  box.innerHTML=`<h2 class="dashBlockTitle">روند کلی صندوق</h2>${overviewHtml}<div style="margin-top:12px"><button class="btn" type="button" onclick="toggleWinnerArchive()">${state.showWinnerArchive?'بستن آرشیو برندگان':'مشاهده کل برندگان'}</button></div>${archiveHtml}<div class="sectionHead" style="margin-top:22px"><h2 class="dashBlockTitle" style="margin:0">روند ماهانه صندوق</h2><select id="dashMonth" aria-label="انتخاب ماه روند مالی" onchange="state.month=Number(this.value);renderDashboardData(state.dashboardData)">${trend.map(x=>`<option value="${x.number}" ${Number(x.number)===Number(state.month)?'selected':''}>${esc(x.month)}</option>`).join('')}</select></div>${monthlyHtml}<div class="sub" style="margin-top:12px">منبع آمار مالی: شیت «گزارش مالی». اعضای جدید از ماه شروع عضویت، اعضای خارج‌شده از ماه خروج و وضعیت غیرفعال، و اعضای تسویه‌شده از ماه تسویه در شیت «لیست اعضا» محاسبه می‌شوند. مقادیر فاقد داده صفر هستند.</div>${winnersHtml}`;

function dashboard(){return `<h1 class="title">داشبورد صندوق</h1><div class="sub">آمار زنده از شیت‌های Google Sheets</div><div id="dashboardData"><div class="empty">در حال دریافت اطلاعات داشبورد...</div></div>`}
function renderServerProfile(p,loanMode,tickerHtml=''){
  const loan=p.loan||null,hasLoan=!!loan;
  const savings=num(p.accumulatedSavings),remaining=num(p.remainingLoan),net=savings-remaining;
  const financial=p.financialStatus||{status:net>0?'بستانکار':net<0?'بدهکار':'تسویه',amount:Math.abs(net)};
  const statusClass=financial.status==='بدهکار'?'statusDebt':financial.status==='بستانکار'?'statusCredit':'statusClear';
  const tile=(label,value,color='blue',icon='◆',large=false)=>`<div class="pj-stat-tile ${color} ${large?'pj-stat-large':''}"><div class="pj-stat-icon">${icon}</div><div class="pj-stat-copy"><div class="pj-stat-label">${esc(label)}</div><div class="pj-stat-value">${esc(value===null||value===undefined||value===''?'—':value)}</div></div></div>`;
  const head=`<div class="pj-profile-head"><div><div class="pj-profile-eyebrow">${loanMode?'نمایه تخصصی وام':'نمایه اطلاعات عضو'}</div><div class="pj-profile-name">${esc(p.name||'—')}</div><div class="pj-profile-code">کد پرسنلی ${fa(p.employeeCode)}</div></div><div class="pj-profile-status ${statusClass}">${esc(loanMode?(hasLoan?'وام فعال':'وام فعال ندارد'):(financial.status||'—'))}${!loanMode&&num(financial.amount)?`<small>${money(financial.amount)}</small>`:''}</div></div>`;
  if(loanMode&&!hasLoan)return `${head}<div class="pj-empty-state">برای این عضو وام فعالی در شیت «مدیریت وام‌ها» ثبت نشده است.</div>`;
  if(loanMode){
    const paid=num(loan.paidInstallments)*num(loan.installmentAmount);
    const items=[
      ['نوع وام',loan.loanType||'—','purple','▤'],['وضعیت وام',loan.status||'فعال','green','✓'],
      ['تاریخ دریافت',loan.receivedDate||'—','amber','▦'],['تعداد کل اقساط',fa(loan.totalInstallments)+' قسط','blue','▤'],
      ['اقساط پرداخت‌شده',fa(loan.paidInstallments)+' قسط','green','↙'],['مبلغ پرداخت‌شده',money(paid),'teal','↓'],
      ['اقساط باقی‌مانده',fa(loan.remainingInstallments)+' قسط','orange','◷'],['سنوات',esc(p.serviceYears||'—')+' سال','purple','⌛'],
      ['ضمانت تجمیعی',money(p.totalGuarantee),'pink','♧'],['وام خرد','در انتظار راه‌اندازی','slate','＋'],
      ['پیش‌پرداخت وام اصلی','در انتظار راه‌اندازی','slate','٪']
    ];
    return `${head}<div class="pj-bento-two pj-profile-bento">${[[tile('مبلغ وام',money(loan.loanAmount),'blue','▣',true),...items.slice(0,4).map(x=>tile(...x))],[tile('مانده بدهی',money(loan.remainingDebt),'orange','◉',true),...items.slice(4,8).map(x=>tile(...x))]].map(group=>`<div class="pj-bento-column">${group[0]}<div class="pj-bento-four">${group.slice(1).join('')}</div></div>`).join('')}</div><div class="pj-profile-section-title">سایر جزئیات وام</div><div class="pj-profile-tile-grid">${items.slice(8).map(x=>tile(...x)).join('')}</div>`;
  }

  const membershipTiles=[
    tile('وضعیت عضویت',p.memberStatus||'—','green','✓'),
    tile('تاریخ عضویت',p.membershipStartMonth||'—','purple','▦'),
    tile('مدت عضویت',fa(p.membershipMonths)+' ماه','teal','◷'),
    tile('سنوات',esc(p.serviceYears||'—')+' سال','amber','⌛'),
    tile('ضمانت تجمیعی',money(p.totalGuarantee),'pink','♧')
  ];
  const membershipSection=`<div class="pj-profile-section-title">اطلاعات عضویت</div><div class="pj-profile-membership-grid">${membershipTiles.join('')}</div>`;

  const loanStatus=hasLoan?(loan.status||'فعال'):(p.loanStatus&&p.loanStatus!=='فعال'?p.loanStatus:'وام فعال ندارد');
  let loanSection=`<div class="pj-profile-section-title">اطلاعات وام</div>${tile('وضعیت وام',loanStatus,hasLoan?'green':'slate','✓')}`;
  if(hasLoan){
    const total=num(loan.totalInstallments),paidCount=num(loan.paidInstallments),remainingCount=num(loan.remainingInstallments);
    const progress=total>0?Math.max(0,Math.min(100,paidCount/total*100)):0;
    loanSection+=`<div class="pj-profile-finance-grid">${tile('مبلغ وام',money(loan.loanAmount),'blue','▣',true)}${tile('مانده وام',money(loan.remainingDebt),'orange','◉',true)}</div>
      <div class="pj-installment-group"><div class="pj-installment-title">وضعیت بازپرداخت اقساط</div><div class="pj-installment-grid">${tile('کل اقساط',fa(total),'blue','▤')}${tile('اقساط پرداخت‌شده',fa(paidCount),'green','✓')}${tile('اقساط باقی‌مانده',fa(remainingCount),'orange','◷')}</div><div class="pj-installment-progress" role="img" aria-label="${fa(Math.round(progress))} درصد اقساط پرداخت شده"><span style="width:${progress.toFixed(1)}%"></span></div><div class="sub" style="text-align:center;margin-top:7px">${fa(Math.round(progress))}٪ از اقساط پرداخت شده است</div></div>
      <div class="pj-profile-finance-grid">${tile('نوع وام',loan.loanType||'—','purple','▤')}${tile('تاریخ دریافت',loan.receivedDate||'—','amber','▦')}</div>`;
  }else{
    loanSection+=`<div class="pj-profile-no-loan">برای این عضو وام فعال ثبت نشده است.</div>`;
  }
  const given=Array.isArray(p.guaranteesGiven)?p.guaranteesGiven:[];
  const guarantor=p.guarantorName||'موردی ثبت نشده';
  loanSection+=`<div class="pj-profile-relations"><div class="pj-profile-relation"><div class="pj-profile-relation-label">ضامن</div><div class="pj-profile-relation-value">${esc(guarantor)}</div></div><div class="pj-profile-relation"><div class="pj-profile-relation-label">ضمانت کرده</div><div class="pj-profile-relation-value">${esc(given.length?given.join('، '):'موردی ثبت نشده')}</div></div></div>`;
  return `${tickerHtml||''}${head}${membershipSection}${loanSection}`;
}

async function findLoanProfile(){
  const c=el('#loanCodeSearch')?.value.trim()||'',box=el('#loanResult');
  if(!c){box.className='empty';box.textContent='کد پرسنلی را وارد کنید.';return;}
  box.className='empty';box.textContent='در حال دریافت اطلاعات وام از اکسل...';
  try{const r=await backendPost({action:'getMemberProfile',employeeCode:String(state.user),targetEmployeeCode:c});

async function loadMemberProfile(){
  const box=el('#myProfileData');if(!box||!state.user)return;
  box.innerHTML='<div class="empty">در حال دریافت نمایه از اکسل...</div>';
  try{
    const profilePromise=backendPost({action:'getMemberProfile',employeeCode:String(state.user)});
    const announcementPromise=state.permissions&&state.permissions.announcements===true
      ?backendPost({action:'getAnnouncements',employeeCode:String(state.user)}).catch(()=>null)
      :Promise.resolve(null);
    const results=await Promise.all([profilePromise,announcementPromise]);
    const r=results[0],announcementResult=results[1];
    if(!r||!r.success||!r.profile){box.innerHTML=`<div class="empty">${esc(r&&r.message||'دریافت نمایه ناموفق بود.')}</div>`;return;}
    let tickerHtml='';
    const notices=announcementResult&&announcementResult.success&&Array.isArray(announcementResult.announcements)?announcementResult.announcements:[];
    if(notices.length){
      const latest=notices[notices.length-1];
      const tickerText=[latest.title,latest.text].filter(Boolean).join(' — ');
      tickerHtml=`<button type="button" class="pj-announcement-ticker" onclick="go('announcements')" aria-label="مشاهده اطلاعیه‌های صندوق"><span class="pj-announcement-ticker-label">اعلان صندوق</span><span class="pj-announcement-ticker-window"><span class="pj-announcement-ticker-track">${esc(tickerText)}</span></span></button>`;
    }
    box.innerHTML=renderServerProfile(r.profile,false,tickerHtml);
  }catch(e){box.innerHTML='<div class="empty">ارتباط با سرور برقرار نشد.</div>';}
}

function openPasswordModal(){const m=el('#passwordModal');if(m)m.classList.add('open')}
function closePasswordModal(){const m=el('#passwordModal');if(m)m.classList.remove('open')}
async function changeMyPasswordUI(){
  const oldPassword=el('#oldPassword')?.value||'';
  const newPassword=el('#newPassword')?.value||'';
  const repeatPassword=el('#repeatPassword')?.value||'';
  const msg=el('#passwordMsg');
  if(msg)msg.textContent='';
  if(!oldPassword||!newPassword||!repeatPassword){if(msg)msg.textContent='هر سه فیلد رمز عبور را کامل کنید.';return;}
  if(newPassword.length<6){if(msg)msg.textContent='رمز جدید باید حداقل ۶ کاراکتر باشد.';return;}
  if(newPassword!==repeatPassword){if(msg)msg.textContent='تکرار رمز جدید با رمز جدید یکسان نیست.';return;}
  if(oldPassword===newPassword){if(msg)msg.textContent='رمز جدید باید با رمز فعلی متفاوت باشد.';return;}
  try{
    const r=await backendPost({action:'changeMyPassword',employeeCode:String(state.user),oldPassword,newPassword});
    if(!r.success){if(msg)msg.textContent=r.message||'تغییر رمز انجام نشد.';return;}
    if(el('#oldPassword'))el('#oldPassword').value='';
    if(el('#newPassword'))el('#newPassword').value='';
    if(el('#repeatPassword'))el('#repeatPassword').value='';
    alert('رمز عبور تغییر کرد. برای اعمال ابطال نشست‌های قبلی، دوباره با رمز جدید وارد شوید.');logout();
  }catch(e){if(msg)msg.textContent='ارتباط با سرور برقرار نشد.';}
}

async function loadRequests(){
  const is=isMemberRequestMode();
  const box=el(is?'#myRequestsBox':'#managerRequestsBox');
  if(!box)return;
  try{
    const r=await backendPost(is?{
      action:'getMyRequests', employeeCode:String(state.user)
    }:{
      action:'getAllRequestsForManager', requesterCode:String(state.user)
    });

function renderRequestCard(x){
  const status=String(x.status||'');
  const cls=status==='تأیید شد'?'approved':status==='رد شد'?'rejected':'pending';
  const isManager=String(state.user||'')==='1001';
  const isVice=String(state.user||'')==='1002';
  const isCashier=String(state.user||'')==='1003';
  const opinionBlock=(label,op,reason,at)=>`<div class="mini" style="background:#f7f9fc;border:1px solid #e3e9f0;border-radius:10px;padding:10px;margin-top:8px"><b>${label}:</b> ${op?`<span class="requestStatus ${op==='موافق'?'approved':'rejected'}">${esc(op)}</span>`:'ثبت نشده'}${reason?`<div style="margin-top:5px">${esc(reason)}</div>`:''}${at?`<small style="display:block;margin-top:4px">زمان ثبت: ${esc(formatDateTime(at))}</small>`:''}</div>`;
  let actions='';
  if(status==='در انتظار بررسی' && (isVice||isCashier)){
    const mine=isVice?x.viceChairOpinion:x.cashierOpinion;
    if(!mine) actions=`<div class="requestActions" style="margin-top:10px"><button class="btn green" onclick="reqOpinion('${esc(x.id)}','موافق')">موافق</button><button class="btn red" onclick="reqOpinion('${esc(x.id)}','مخالف')">مخالف</button></div>`;
    else actions='<div class="sub" style="margin-top:8px">نظر شما ثبت شده و قابل تغییر نیست.</div>';
  }
  if(status==='در انتظار بررسی' && isManager){
    if(x.viceChairOpinion && x.cashierOpinion){
      actions=`<div class="requestActions" style="margin-top:12px"><button class="btn green" onclick="reqStatus('${esc(x.id)}','تأیید شد')">تصمیم نهایی: تأیید</button><button class="btn red" onclick="reqStatus('${esc(x.id)}','رد شد')">تصمیم نهایی: رد</button></div>`;
    }else{
      actions='<div class="sub" style="margin-top:10px;color:#9a6700">تصمیم نهایی پس از ثبت نظر مستقل نایب‌رئیس و صندوق‌دار فعال می‌شود.</div>';
    }
  }
  const opinionsHtml=isManager?`<div style="margin-top:12px"><b>نظرهای مشورتی</b>${opinionBlock('نایب‌رئیس',x.viceChairOpinion,x.viceChairReason,x.viceChairAt)}${opinionBlock('صندوق‌دار',x.cashierOpinion,x.cashierReason,x.cashierAt)}</div>`:isVice?`<div style="margin-top:12px"><b>نظر شما (نایب‌رئیس)</b>${opinionBlock('نایب‌رئیس',x.viceChairOpinion,x.viceChairReason,x.viceChairAt)}</div>`:isCashier?`<div style="margin-top:12px"><b>نظر شما (صندوق‌دار)</b>${opinionBlock('صندوق‌دار',x.cashierOpinion,x.cashierReason,x.cashierAt)}</div>`:'';
  return `<div class="notice"><h3>${esc(x.title||'بدون عنوان')}</h3><div><b>نوع:</b> ${esc(x.type||'—')}</div>${x.description?`<div style="margin-top:5px"><b>شرح:</b> ${esc(x.description)}</div>`:''}<small>${isMemberRequestMode()?'':'عضو: '+esc(x.name||'—')+' · کد: '+fa(x.employeeCode||'—')+' · '}${status?`<span class="requestStatus ${cls}">${esc(status)}</span>`:''}${x.createdAt?' · '+esc(formatDate(x.createdAt)):''}</small>${!isMemberRequestMode()?opinionsHtml:''}${x.managerResponse?`<div style="margin-top:10px"><b>تصمیم نهایی مدیر و دلیل:</b> ${esc(x.managerResponse)}</div>`:''}${x.reviewedAt?`<small>زمان تصمیم نهایی: ${esc(formatDateTime(x.reviewedAt))}</small>`:''}${actions}</div>`;
}

function formatDate(v){
  if(!v)return '';
  const d=new Date(v);
  if(isNaN(d.getTime()))return String(v);
  return d.toLocaleDateString('fa-IR');
}
function formatDateTime(v){if(!v)return '';const d=new Date(v);if(isNaN(d.getTime()))return String(v);return d.toLocaleDateString('fa-IR')+' - '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});}

async function reqAdd(){
  const type=el('#rt')?.value.trim()||'';
  const title=el('#rqTitle')?.value.trim()||'';
  const description=el('#rqDesc')?.value.trim()||'';
  if(!type||!title||!description){alert('نوع درخواست، عنوان و شرح را کامل کنید.');return;}
  try{
    const r=await backendPost({action:'createRequest',employeeCode:String(state.user),requestType:type,title,description});
    if(!r.success){alert(r.message||'ثبت درخواست ناموفق بود.');return;}
    alert('درخواست با موفقیت ثبت شد.');
    go('requests');
  }catch(e){alert('ارتباط با سرور برقرار نشد.');}
}

async function reqStatus(id,status){
  if(String(state.user||'')!=='1001'){alert('ثبت تصمیم نهایی فقط برای مدیر صندوق مجاز است.');return;}
  const defaultReason=status==='رد شد'?'':'درخواست تأیید شد؛ مبلغ پس از انجام مراحل اداری به‌زودی پرداخت خواهد شد.';
  const managerResponse=prompt(status==='رد شد'?'دلیل رد درخواست را وارد کنید:':'دلیل پذیرش درخواست را وارد کنید:',defaultReason);
  if(managerResponse===null || !managerResponse.trim()){alert('ثبت دلیل تصمیم نهایی الزامی است.');return;}
  try{
    const r=await backendPost({action:'reviewRequest',requesterCode:String(state.user),requestId:String(id),decision:status,managerResponse:managerResponse.trim()});
    if(!r.success){alert(r.message||'ثبت تصمیم نهایی انجام نشد.');return;}
    alert('تصمیم نهایی ثبت شد.');loadRequests();
  }catch(e){alert('ارتباط با سرور برقرار نشد.');}
}
async function reqOpinion(id,opinion){
  const reason=prompt('دلیل نظر '+opinion+' خود را وارد کنید:','');
  if(reason===null || !reason.trim()){alert('ثبت دلیل نظر الزامی است.');return;}
  try{
    const r=await backendPost({action:'submitCommitteeOpinion',requesterCode:String(state.user),requestId:String(id),opinion,reason:reason.trim()});
    if(!r.success){alert(r.message||'ثبت نظر انجام نشد.');return;}
    alert('نظر شما ثبت شد.');loadRequests();
  }catch(e){alert('ارتباط با سرور برقرار نشد.');}
}

async function loadAnnouncementUnread(){
  if(!state.user || !state.permissions || state.permissions.announcements!==true) return;
  try{
    const r=await backendPost({action:'getAnnouncements',employeeCode:String(state.user)});
    state.announcementUnread=r.success?Number(r.unreadCount||0):0;
    updateAnnouncementBadges();
  }catch(e){

async function loadAnnouncements(){

  try{

    state.announcementUnread=Number(r.unreadCount||0);
    updateAnnouncementBadges();

      ${items.map(x=>`<div class="notice ${x.unread?'unread':''}"><h3>${x.unread?'● ':''}${esc(x.title)}</h3><div>${esc(x.text)}</div><small>${esc(x.dateText||x.createdAt||'')} · ${x.unread?'خوانده نشده':'خوانده شده'}</small>${x.unread?`<div style="margin-top:8px"><button class="btn" onclick="markAnnouncementRead('${esc(String(x.id))}')">علامت‌گذاری به‌عنوان خوانده‌شده</button></div>`:''}</div>`).join('')||'<div class="empty">اطلاعیه‌ای ثبت نشده است.</div>'}`;

async function annAdd(){
  const t=el('#at')?.value.trim()||'', x=el('#ax')?.value.trim()||'';

  try{
    const r=await backendPost({action:'createAnnouncement',requesterCode:String(state.user),title:t,text:x});
    if(!r.success){alert(r.message||'ثبت اطلاعیه انجام نشد.');return;}
    loadAnnouncements();
  }catch(e){alert('ارتباط با سرور برقرار نشد.');}
}

async function annDel(id){
  if(!confirm('این اطلاعیه حذف شود؟'))return;
  try{
    const r=await backendPost({action:'deleteAnnouncement',requesterCode:String(state.user),announcementId:String(id)});
    if(!r.success){alert(r.message||'حذف اطلاعیه انجام نشد.');return;}
    loadAnnouncements();
  }catch(e){alert('ارتباط با سرور برقرار نشد.');}
}

async function markAnnouncementRead(id){
  try{
    const r=await backendPost({action:'markAnnouncementRead',employeeCode:String(state.user),announcementId:String(id)});
    if(!r.success){alert(r.message||'ثبت مشاهده اطلاعیه انجام نشد.');return;}

  }catch(e){alert('ارتباط با سرور برقرار نشد.');}
}

async function resetEmployeePasswordUI(){const code=el('#resetPasswordCode')?.value.trim()||'',msg=el('#resetPasswordMsg');if(!code){msg.textContent='کد پرسنلی را وارد کنید.';return;}if(!confirm('رمز فعلی باطل و یک رمز موقت تازه صادر شود؟'))return;try{const r=await backendPost({action:'resetEmployeePassword',employeeCode:String(state.user),requesterCode:String(state.user),targetEmployeeCode:code});if(!r.success){msg.textContent=r.message||'صدور ناموفق بود.';return;}msg.textContent=r.message+' رمز موقت: '+r.temporaryPassword;window.__pjSingleCredential={employeeCode:code,name:'',password:r.temporaryPassword};msg.innerHTML=esc(r.message)+`<br>رمز موقت: <strong>${esc(r.temporaryPassword)}</strong> <button class="btn" onclick="renderCredentialPrint([window.__pjSingleCredential],'رمز موقت')">چاپ برگه</button>`;}catch(e){msg.textContent='ارتباط با سرور برقرار نشد.';}}

async function loadProfileAccessLogs(){

const ACCESS_ITEMS=[
  ['dashboard','داشبورد','مشاهده اطلاعات مدیریتی صندوق'],
  ['members','لیست اعضا','جستجو و مشاهده اطلاعات اعضا'],
  ['loans','وام','جستجو و مشاهده اطلاعات وام'],
  ['moneyFlow','مسیر پول','مشاهده ورودی، خروجی و جریان مالی'],
  ['requests','درخواست‌ها','مشاهده و مدیریت درخواست‌ها'],
  ['announcements','اعلانات','مشاهده یا مدیریت اطلاعیه‌ها'],
  ['settings','تنظیمات','دسترسی به تنظیمات و مدیریت دسترسی کاربران']
];

function backendPost(payload){
  return new Promise((resolve,reject)=>{
    if(typeof google==='undefined'||!google.script||!google.script.run){reject(new Error('این صفحه باید از Web App مربوط به Apps Script باز شود.'));return;}
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      .apiDispatch({...payload,token:state.sessionToken});
  });
}

function accessValue(v){
  if(v===true || String(v).trim()==='بله') return 'yes';
  if(v===false || String(v).trim()==='خیر') return 'no';
  return 'inherit';
}
function accessSectionValue(key, extra, levels){
  const level=(levels||{})[key];
  if(level==='manage'||level==='view') return level;
  if((extra||{})[key]===false) return 'no';
  if((extra||{})[key]===true) return 'view';
  return 'inherit';
}

async function searchAccessUser(){
  const code=el('#accessCode').value.trim();
  const box=el('#accessResult');
  if(!code){box.className='empty';box.innerHTML='کد پرسنلی را وارد کنید.';return}
  box.className='empty';box.innerHTML='در حال دریافت اطلاعات...';
  try{
    const r=await backendPost({
      action:'getUserAccessForManager',
      requesterCode:String(state.user),
      employeeCode:String(code)
    });
    if(!r.success){
      box.className='empty';
      box.innerHTML=esc(r.message||'کاربر پیدا نشد.');
      return;
    }
    const u=r.user||r.data||r.result||r;
    const permissions=r.permissions||u.permissions||{};
    const extra=r.extraPermissions||u.extraPermissions||r.customPermissions||u.customPermissions||permissions;
    const extraLevels=r.customPermissionLevels||u.customPermissionLevels||{};
    const name=u.name||r.name||'—';
    const role=u.role||r.role||'عضو';
    const status=u.memberStatus||u.status||r.status||'فعال';

    box.className='';
    box.innerHTML=`<div class="accessInfo">
      <div class="mini"><div class="k">نام</div><div class="v">${esc(name)}</div></div>
      <div class="mini"><div class="k">کد پرسنلی</div><div class="v">${fa(code)}</div></div>
      <div class="mini"><div class="k">نقش</div><div class="v">${esc(role)}</div></div>
      <div class="mini"><div class="k">وضعیت</div><div class="v">${esc(status)}</div></div>
      <div class="mini"><div class="k">دسترسی مؤثر</div><div class="v">از نقش + تنظیم شخصی</div></div>
    </div>
    <div class="permissionRows">
      ${ACCESS_ITEMS.map(([key,title,hint])=>`<div class="permissionRow">
        <div><div class="permissionName">${esc(title)}</div><div class="permissionHint">${esc(hint)}</div></div>
        <select class="permissionSelect" id="perm_${key}" ${key==='settings'?'disabled':''}>
          ${key==='settings' ? `<option value="no" selected>فقط مدیر صندوق</option>` : key==='requests'||key==='announcements' ? `
            <option value="inherit" ${accessSectionValue(key,extra,extraLevels)==='inherit'?'selected':''}>پیش‌فرض نقش</option>
            <option value="view" ${accessSectionValue(key,extra,extraLevels)==='view'?'selected':''}>فقط مشاهده</option>
            <option value="manage" ${accessSectionValue(key,extra,extraLevels)==='manage'?'selected':''}>مدیریت</option>
            <option value="no" ${accessSectionValue(key,extra,extraLevels)==='no'?'selected':''}>بدون دسترسی</option>
          ` : `
            <option value="inherit" ${accessValue(extra[key])==='inherit'?'selected':''}>پیش‌فرض نقش</option>
            <option value="yes" ${accessValue(extra[key])==='yes'?'selected':''}>اجازه دارد</option>
            <option value="no" ${accessValue(extra[key])==='no'?'selected':''}>اجازه ندارد</option>
          `}
        </select>
      </div>`).join('')}
    </div>
    <div class="accessActions">
      <button class="btn" onclick="saveAccessUser('${esc(code)}')">ذخیره دسترسی‌های این شخص</button>
      <button class="btn" style="background:#eef3f8!important;color:#0b2d5b!important" onclick="go('settings')">پاک کردن</button>
    </div>
    <div id="accessMsg" class="accessMsg"></div>`;
  }catch(e){
    box.className='empty';
    box.innerHTML='ارتباط با سرور برقرار نشد. تنظیمات این شخص ذخیره نشد.';
  }
}

async function saveAccessUser(code){
  const msg=el('#accessMsg');
  const permissions={};
  ACCESS_ITEMS.forEach(([key])=>{
    const v=el('#perm_'+key)?.value||'inherit';
    if(key==='requests'||key==='announcements'){
      permissions[key]=v==='manage'?'manage':v==='view'?'view':v==='no'?false:null;
    }else{
      permissions[key]=v==='yes'?true:v==='no'?false:null;
    }
  });
  msg.className='accessMsg show';
  msg.textContent='در حال ذخیره...';
  try{
    const r=await backendPost({
      action:'updateUserPermissions',
      requesterCode:String(state.user),
      employeeCode:String(code),
      permissions
    });
    if(!r.success){
      msg.className='accessMsg err show';
      msg.textContent=r.message||'ذخیره دسترسی‌ها انجام نشد.';
      return;
    }
    msg.className='accessMsg ok show';
    msg.textContent='دسترسی‌های این شخص با موفقیت ذخیره شد.';
    // Keep the current manager session untouched.
  }catch(e){
    msg.className='accessMsg err show';
    msg.textContent='ارتباط با سرور برقرار نشد؛ تغییرات ذخیره نشد.';
  }
}

function announcements(){return `<div class="empty">در حال دریافت اطلاعیه‌ها...</div>`;}

const views={dashboard,members,loans,money:moneyFlow,profile,requests,announcements,settings};render();</script></body></html>
